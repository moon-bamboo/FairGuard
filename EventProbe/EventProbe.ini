; ============================================================
;  EventProbe.ini —— 探针 + 自动装车检测器 配置
;
;  这个 DLL 里有【两件事】：
;
;   [EventProbe] 探针 —— 每帧读取引擎的待执行事件队列
;                EventClass::DoList，按玩家统计"这一帧下达了多少条命令"，
;                写进日志。属于调研/诊断工具。
;
;   [Detector]   检测器 —— 实时判据：同一帧内某玩家的一批 MegaMission
;                事件里，若「目的地不同取值个数」≈「发令单位不同取值个数」
;                （= 每个单位配一辆【不同】载具），就判定为自动装车，
;                在屏幕上提示 + 写进带哈希链的日志。这是给对局用的。
;
;  两者共用同一次取样，可以各自开关。
;
;  本插件只【读】事件队列、只往本地消息列表发一条提示 ——
;  不发送任何游戏事件、不修改任何游戏状态，因此：
;    · 只需自己安装，联机时对手不用装
;    · 不会造成不同步（与 ChatBox 同理）
;
;  日志位置：<游戏目录>\MsgLog\EventProbe_日期_时间.log
; ============================================================

[EventProbe]

; ------------------------------------------------------------
; 总开关
;   1 = 开启（默认）
;   0 = 完全不动（连日志都不写，DLL 加载后什么都不做）
; ------------------------------------------------------------
Enable=1

; ------------------------------------------------------------
; 是否输出每条事件的原始字节（十六进制）
;   0 = 只输出统计行（默认，日志小、便于看趋势）
;   1 = 每条事件额外输出一行 hex
;
;   ★ 校准阶段请打开这一项。
;     EventClass 头部四个字段（类型/是否已执行/玩家/帧号）是有依据的，
;     但 DataBuffer 里 Mission、Destination 等参数的偏移【没有校准过】，
;     必须靠实测字节来对照，不能照抄推算值。
;
;   输出形如：
;     raw f=12480 h=1 t=0x04 fr=12480 ex=0 | 04 00 01 30 30 00 00 07 ...
;                                             ^^ 前 DumpBytes 个字节
; ------------------------------------------------------------
DumpRaw=0

; ------------------------------------------------------------
; 上面那一行 dump 多少字节（默认 32，范围 8 ~ 111）
;
;   32 字节足够看清头部 + MegaMission 的前几个字段；
;   想看完整一条就填 111（但日志会变得很大）。
; ------------------------------------------------------------
DumpBytes=32

; ------------------------------------------------------------
; 突发告警阈值（默认 5）
;
;   某一帧里某个玩家的"操作类命令"达到这个数，就在日志里加一行：
;     *** BURST f=12480 h=1 ops=9 ...
;
;   这个数只是【先给个初值】—— 正常玩家一帧到底能下多少命令，
;   必须靠实测基线来定。第一轮测试建议先设成很大的值（比如 99）
;   把基线录下来，再回来调。
; ------------------------------------------------------------
BurstOps=5

; ------------------------------------------------------------
; 没事件的帧要不要也记一行
;   0 = 不记（默认，日志干净，只记有事件的帧）
;   1 = 每帧都记一行（能看出"探针一直在跑"，也便于算帧率）
;
;   排查"探针到底有没有在工作"时打开它。
; ------------------------------------------------------------
LogEveryFrame=0

; ------------------------------------------------------------
; 日志编码
;   0 = 本地代码页 GBK（默认，记事本能直接打开）
;   1 = UTF-8 带 BOM（便于用脚本/VSCode 处理）
; ------------------------------------------------------------
LogUtf8=0


; ============================================================
;  [Detector]  自动装车检测器
; ============================================================
;
;  判据（已由真实联机数据验证）：
;
;    同一帧内、同一玩家的一批 MegaMission 事件里，
;    「Destination 的不同取值个数」≈「Whom 的不同取值个数」
;    —— 也就是"每个单位配一辆【不同】的载具" —— 判定为自动装车。
;
;  为什么可靠（这是"逻辑必然"，不是拍脑袋的启发式）：
;    要让 10 个单位各进 10 辆不同载具，玩家必须逐个操作
;    （点单位A → 点载具A → 点单位B → 点载具B ……）共 20 次点击，
;    人手不可能压进同一帧（一帧约 1/60 秒）。插件一次下发就能。
;
;  实测对照：
;    手动：多单位进同一辆载具      Destination 唯一值 = 1
;    手动：PvP 技巧（进两辆）      Destination 唯一值 = 2
;    自动装车：10 单位配 10 辆     Destination 唯一值 = 10
;    1 与 10 之间没有模糊地带。
;
;  命中时日志长这样：
;    *** DETECT f=26004 h=1 units=10 veh=10 MM=10 (Move=0 Enter=10) ratio=100% chain=1A2B3C4D
;    *** DETECT-REPEAT f=26548 h=1 hitsInWindow=2/600 frames, totalHits=2
;  局末或定期还有：
;    [DETECT-SUMMARY] ver=1.1 f=... hits=2 scans=812 chain=<64位十六进制> recs=2
;
;  ⚠️ 房号(h) 是引擎里的玩家槽位编号，不一定等于游戏里的"玩家1/玩家2"。
;     哪台机器是哪个房号，要从日志里核对（别靠"谁消息多"猜）。
; ============================================================

[Detector]

; ------------------------------------------------------------
; 检测器总开关
;   1 = 开启（默认）
;   0 = 只做探针统计，不判定、不告警、不提示
; ------------------------------------------------------------
Enable=1

; ------------------------------------------------------------
; 规模门槛：单帧该玩家的 MegaMission 至少要这么多条
;   默认 5。调小能抓"小规模自动装车"，但正常操作被误判的机会也会变大。
;   实测正常玩家单帧操作数只有 1~3，而自动装车是 10 —— 区分度足够。
; ------------------------------------------------------------
MinEvents=5

; ------------------------------------------------------------
; 目的地门槛：单帧该玩家至少要有这么多个【不同】的 Destination
;   默认 5。这是判据的核心 —— 手动操作无论框多少单位，
;   只要点的是同一辆载具，这个值恒为 1。
; ------------------------------------------------------------
MinDest=5

; ------------------------------------------------------------
; 多样性比例：Destination 不同取值数 至少要达到 单位数的百分之几
;   默认 50。也就是"至少有半个单位数那么多的不同载具"才算可疑。
;
;   验算：10 个单位配 5 辆不同载具 -> 5 >= 10*50% -> 命中
;         10 个单位配 4 辆           -> 4 <  10*50% -> 不命中
;
;   调高更严格（100 = 必须严格一对一），调低更宽松但更易误报。
; ------------------------------------------------------------
RatioPercent=50

; ------------------------------------------------------------
; 命中时是否在【屏幕上】弹一句提示
;   1 = 弹（默认）。走引擎自己的消息通道，显示在游戏的消息区，
;       和"结盟提示""快捷键提示"是同一个位置。
;   0 = 只在日志里记，屏幕上什么都不显示（联机做对照实验时建议关掉）
;
;   注意：装了 ChatBox 的话，这条提示会显示在 ChatBox 的消息窗里。
; ------------------------------------------------------------
ShowAlert=1

; ------------------------------------------------------------
; 屏幕提示停留多少秒（默认 10）
; ------------------------------------------------------------
AlertSeconds=10

; ------------------------------------------------------------
; 命中时是否把那一批事件的原始字节也写进日志（默认 0）
;   1 = 每条事件一行 "detraw ..."，便于事后人工复核判据。
;       只写命中帧，量不大；但正常玩一局日志会明显变长。
; ------------------------------------------------------------
LogRaw=0

; ------------------------------------------------------------
; 滑动窗口长度（帧）与窗口内命中次数门槛
;
;   为什么要第二层：联机时 Execute_DoList 大约只有一半的帧被调用，
;   单帧判据本身够硬，但"短时间反复出现"更能说明问题。
;
;   默认 WindowFrames=600（约 10 秒）、WindowHits=2：
;   10 秒内命中第 2 次，就额外输出一行 *** DETECT-REPEAT，
;   屏幕提示也会变成"可疑·重复"。
;
;   想只报一次、不要升级告警：把 WindowHits 设成一个很大的数（如 999）。
; ------------------------------------------------------------
WindowFrames=600
WindowHits=2

; ------------------------------------------------------------
; 日志哈希链（防事后篡改）
;   1 = 开启（默认）
;
;   每条 DETECT 行都带一个 chain= 值，它是
;       chain = SHA256(上一条 chain || 本条记录 || 命中事件的头部字节)
;   局末再写一次最终值。想改中间任意一行，之后所有 chain 值都得重算，
;   对不上就暴露。
;
;   ⚠️ 局限（请务必知道）：
;     · 只能防【事后修改】，防不住【整份重新生成】（算法公开、无密钥）
;     · 单人日志【无法自证】，要成为有效证据需要多方交叉核对
;     · 因此只对事件头部（+0..+12）做哈希 —— 目的地之后
;       在不同机器上不一样（那是本地状态），整条哈希无法交叉验证
; ------------------------------------------------------------
HashChain=1

; ------------------------------------------------------------
; 定期汇总间隔（帧，默认 1800 ≈ 30 秒）
;
;   有新的命中时才输出一行 [DETECT] alive/summary，用来回答
;   "检测器还在跑吗、这一局一共命中几次"。
;   对局中途退回主菜单不会触发 DLL 卸载，所以需要这个定期输出兜底；
;   退出游戏时还会再补一条最终的 [DETECT-SUMMARY]。
;
;   0 = 不做定期汇总，只在退出游戏时输出一次。
; ------------------------------------------------------------
SummaryEvery=1800

; ------------------------------------------------------------
; 要忽略的房号（逗号分隔，例如 3,5）—— 留空 = 不忽略任何人
;
;   联机遭遇战里的电脑玩家(AI)也有自己的房号，AI 可能成批下发命令。
;   如果发现某个房号总是误报、且确认那是 AI，就在这里排除它。
;
;   ⚠️ 排除了就真的看不到了，别把真人玩家的房号写进来。
; ------------------------------------------------------------
IgnoreHouses=
