; ============================================================
;  FairGuard.ini —— 对手异常操作检测（配置）
;
;  这是什么：
;    联机对局里，识别**其他玩家**是否使用了影响平衡的插件
;    （目前落地的是"自动装车"这一类）。
;    判据用的是引擎自己广播给每个客户端的命令队列 ——
;    所以【只需要自己装】，对手装不装都一样查得到。
;
;  这个 DLL 里有两件事，共用同一次取样，可以各自开关：
;
;   [Detector] 检测器（正式功能）——
;        实时判定 + 屏幕上提示 + 带哈希链的日志。
;   [Probe] 探针（诊断用，可以关掉）——
;        逐帧统计"这一帧下了多少条命令"，用来核对地址、
;        排查"为什么一条数据都没有"。
;
;  安全性：只【读】事件队列；屏幕上那句提示走引擎自己的本地消息通道，
;  不进事件队列。因此不会造成不同步（与 ChatBox 同理）。
;
;  日志位置：<游戏目录>\MsgLog\FairGuard_日期_时间.log
; ============================================================

[Probe]

; ------------------------------------------------------------
; ★ 探针总开关
;
;   0 = 关闭（**正式使用的默认值**）
;   1 = 开启 —— 逐帧输出命令统计（evt / list / BURST 行）
;
;   为什么默认关：实测一局 4.5 分钟的日志是 16,159 行 / 1 MB，
;   其中 **15,540 行（96%）是探针的 evt 行**。关掉后日志只剩检测器的
;   告警与汇总，体积降到约 1/25。
;
;   什么时候打开它：
;     · 怀疑"一条数据都没有" —— list 行的 in= 能看出事件队列有没有内容
;     · 要核对地址 / 字段解析是否正确（配合 DumpRaw）
;     · 想知道逐帧的命令量基线
;   （只想知道"为什么漏报"的话，优先用 [Detector] TraceAll，那个更直接）
;
;   注意：关掉它**不影响检测器** —— 两者共用同一次取样。
; ------------------------------------------------------------
Enable=0

; ------------------------------------------------------------
; 是否输出每条事件的原始字节（十六进制）  ← 仅 [Probe] Enable=1 时有意义
;   0 = 只输出统计行（默认，日志小、便于看趋势）
;   1 = 每条事件额外输出一行 hex
;
;   DataBuffer 里的字段偏移（Whom/Mission/Destination）已经在
;   真实联机日志上实地校准过（见 开发文档/01 第三节），所以平时不用开。
;   只有在"怀疑字段解析错了"时才打开，用已知操作去对照原始字节。
;
;   输出形如：
;     raw f=12480 h=1 t=0x04 fr=12480 ex=0 | 04 00 01 30 30 00 00 07 ...
;                                             ^^ 前 DumpBytes 个字节
; ------------------------------------------------------------
DumpRaw=0

; ------------------------------------------------------------
; 上面那一行 dump 多少字节（默认 32，范围 8 ~ 111）
;   ← 仅 DumpRaw=1 时有意义
;
;   32 字节足够看清头部 + MegaMission 的前几个字段；
;   想看完整一条就填 111（但日志会变得很大）。
; ------------------------------------------------------------
DumpBytes=32

; ------------------------------------------------------------
; 突发告警阈值（默认 5）  ← 仅 [Probe] Enable=1 时有意义
;
;   某一帧里某个玩家的"操作类命令"达到这个数，就在日志里加一行：
;     *** BURST f=12480 h=1 ops=9  (MegaMission=9, Mission=7(Enter): 9)
;
;   ⚠️ 这**不是判据** —— 它只看"命令条数多不多"，不看目的地，
;   正常玩家框选一批单位点一辆车也会触发。真正的判据是 `*** DETECT` 行。
;   留着它是因为它顺带给出了该房号的 MegaMission / Enter 计数，
;   排查漏报时有用（1.2 修正漏报就是靠这一行找到证据的）。
;
;   嫌吵就设成很大的值（如 99）。
; ------------------------------------------------------------
BurstOps=5

; ------------------------------------------------------------
; 没事件的帧要不要也记一行  ← 仅 [Probe] Enable=1 时有意义
;   0 = 不记（默认，日志干净，只记有事件的帧）
;   1 = 每帧都记一行（能看出"探针一直在跑"，也便于算帧率）
;
;   排查"探针到底有没有在工作"时打开它。
; ------------------------------------------------------------
LogEveryFrame=0

; ------------------------------------------------------------
; 日志编码
;   0 = 本地代码页 GBK（默认，记事本能直接打开）
;   1 = UTF-8 带 BOM（便于用脚本/VSCode 处理）
; ------------------------------------------------------------
LogUtf8=0


; ============================================================
;  [Detector]  自动装车检测器
; ============================================================
;
;  判据（已由真实联机数据验证）：
;
;    同一帧内、同一玩家的一批 MegaMission 事件里，
;    「Destination 的不同取值个数」≈「Whom 的不同取值个数」
;    —— 也就是"每个单位配一辆【不同】的载具" —— 判定为自动装车。
;
;    ⚠️ 只对 **Enter(Mission=7)** 这类"目标是具体对象"的命令成立，
;       所以有 MissionFilter 这个开关 —— 详情见下面 MissionFilter 那段。
;
;  为什么可靠（这是"逻辑必然"，不是拍脑袋的启发式）：
;    要让 10 个单位各进 10 辆不同载具，玩家必须逐个操作
;    （点单位A → 点载具A → 点单位B → 点载具B ……）共 20 次点击，
;    人手不可能压进同一帧（一帧约 1/60 秒）。插件一次下发就能。
;
;  实测对照：
;    手动：多单位进同一辆载具      Destination 唯一值 = 1   -> 不报
;    手动：PvP 技巧（进两辆）      Destination 唯一值 = 2   -> 不报
;    自动装车：20 单位配 3 辆      Destination 唯一值 = 3   -> 报
;    自动装车：10 单位配 10 辆     Destination 唯一值 = 10  -> 报
;    路径点模式移动 20 个单位      Destination 唯一值 10~14 --★ 但 Mission 是 Move，
;                                                            被 MissionFilter 挡掉
;  注意最后一行：**光看 Destination 个数会把它误判成作弊**，
;  这就是 1.2 为什么要加 MissionFilter（1.1 因此误报过）。
;
;  命中时日志长这样：
;    *** DETECT f=26004 h=1 units=10 veh=10 MM=10 (Move=0 Enter=10) ratio=100% chain=1A2B3C4D
;    *** DETECT-REPEAT f=26548 h=1 hitsInWindow=2/600 frames, totalHits=2
;  开了 TraceAll 时，没命中的规模帧也有一行（诊断漏报用）：
;    trace f=13823 h=0 units=0 veh=0 MM=0 (Move=0 Enter=0 Other=20) ratio=0% filtered=20
;  局末或定期还有：
;    [DETECT-SUMMARY] ver=1.2 f=... hits=2 scans=812 chain=<64位十六进制> recs=2
;
;  ⚠️ 房号(h) 是引擎里的玩家槽位编号，不一定等于游戏里的"玩家1/玩家2"。
;     哪台机器是哪个房号，要从日志里核对（别靠"谁消息多"猜）。
; ============================================================

[Detector]

; ------------------------------------------------------------
; 检测器总开关
;   1 = 开启（默认）
;   0 = 只做探针统计，不判定、不告警、不提示
; ------------------------------------------------------------
Enable=1

; ------------------------------------------------------------
; 规模门槛：单帧该玩家的 MegaMission 至少要这么多条
;   默认 5。调小能抓"小规模自动装车"，但正常操作被误判的机会也会变大。
;   实测正常玩家单帧操作数只有 1~3，而自动装车是 10 —— 区分度足够。
; ------------------------------------------------------------
MinEvents=5

; ------------------------------------------------------------
; ★★ MissionFilter —— 只对哪些 Mission 做判定（1.2 最重要的修正）
;
;   默认 "7"（= Enter，进入载具/建筑）。
;
;   为什么必须限制：不同的 Mission，Destination 的语义不一样。
;
;     Mission=2 (Move)  目标是【格子】。看起来"20 个单位点同一个点"应该
;                       只有一个目的地，但**路径点模式**下引擎会给每个单位
;                       展开各自的目标格 —— Destination 天然分散。
;                       实测：20 个单位同一次操作给出 10~14 个不同值。
;                       拿它判定 → 整批误报（1.1 就是这么被用户抓到的）。
;
;     Mission=7 (Enter) 目标是【载具本体】。手动装车不管框多少单位、
;                       点的是同一辆车，Destination 恒为 1；自动装车
;                       10 单位配 10 辆则为 10。判据只在这个语义上成立。
;
;   写法：逗号分隔的 Mission 编号，例如 "7"、"2,7"。
;         填 0 = 不过滤（1.1 的旧行为，会误报路径点移动）。
;
;   代价：如果某个装车插件改用 Move 实现，本判据会漏掉它。
;         实测那个插件（AutoLoad）走的是 Enter，所以默认取 7。
;         如果你发现"明明开挂却没报"，试着改成 "2,7" 再看，
;         但要接受路径点移动可能重新变成误报。
; ------------------------------------------------------------
MissionFilter=7

; ------------------------------------------------------------
; 目的地门槛：单帧该玩家至少要有这么多个【不同】的 Destination
;   默认 3（1.2 从 5 降下来）。
;
;   这是判据的核心数字 —— 手动操作无论框多少单位，
;   只要点的是同一辆载具，这个值恒为 1。
;
;   为什么是 3：用户实测"20 个单位 + 3 辆 6 容量载具自动装车"，
;   veh 只有 3，被原来的 5 挡掉了。而人手不可能在同一帧里点中
;   3 辆【不同】的载具 —— 所以 3 是安全的下限。
;   2 仍然不报（那是人力可为的 PvP 技巧，留作容错）。
; ------------------------------------------------------------
MinDest=3

; ------------------------------------------------------------
; 多样性比例：Destination 不同取值数 至少要达到 单位数的百分之几
;   默认 0 = **不检查比例**（1.2 改的，1.1 是 50）。
;
;   1.1 用 50% 时，"20 个单位进 3 辆载具"（3/20 = 15%）会被比例条件挡掉，
;   而用户实测认为这种操作也该检测出来。
;
;   只判 Enter 之后，比例条件其实已无必要（人手没法同帧点多个不同载具），
;   所以默认关掉。想更严格就设一个百分比：
;     50  = 至少要有"半个单位数"那么多的不同载具
;     100 = 必须严格一对一（最严，可能漏掉混装）
; ------------------------------------------------------------
RatioPercent=0

; ------------------------------------------------------------
; 命中时是否在【屏幕上】弹一句提示
;   1 = 弹（默认）。走引擎自己的消息通道，显示在游戏的消息区，
;       和"结盟提示""快捷键提示"是同一个位置。
;   0 = 只在日志里记，屏幕上什么都不显示（联机做对照实验时建议关掉）
;
;   注意：装了 ChatBox 的话，这条提示会显示在 ChatBox 的消息窗里。
; ------------------------------------------------------------
ShowAlert=1

; ------------------------------------------------------------
; 屏幕提示停留多少秒（默认 10）
;
;   决定"弹出来之后留多久"。下一项决定"多久才弹一次"，两者配合。
; ------------------------------------------------------------
AlertSeconds=10

; ------------------------------------------------------------
; ★ 屏幕提示节流：同一房号在这么多秒内**只弹一次**（默认 10；0 = 不节流）
;
;   为什么需要它：实测里"运输车装卸循环"会在 8 秒内连续命中 40 多次。
;   不节流的话屏幕提示每帧都被刷新，一直停不下来，看着像是坏了
;   （1.3 才加的这一项，就是那次实机测试暴露出来的）。
;
;   ⚠️ **日志完全不受影响** —— 每一次命中都照常逐条记录，
;   证据一点不丢，只是屏幕上不刷屏。
;
;   想看每一次命中都弹出来：设 0。
; ------------------------------------------------------------
AlertThrottleSeconds=10

; ------------------------------------------------------------
; 命中时是否把那一批事件的原始字节也写进日志（默认 0）
;   1 = 每条事件一行 "detraw ..."，便于事后人工复核判据。
;       只写命中帧，量不大；但正常玩一局日志会明显变长。
; ------------------------------------------------------------
LogRaw=0

; ------------------------------------------------------------
; TraceAll —— 诊断开关：把"规模达标但**没有**命中"的帧也记一行（默认 0）
;
;   输出形如：
;     trace f=13823 h=0 units=0 veh=0 MM=0 (Move=0 Enter=0 Other=20) ratio=0% filtered=20
;
;   它是回答"为什么没报"的唯一第一手材料：
;     filtered=20 说明这批命令的 Mission 不在 MissionFilter 里（换 Mission 或改配置）
;     veh=2       说明目的地还不够分散（可能真的是手动操作，或者规模太小）
;
;   只在 MinEvents 达标时才记，所以日志量不大。
;   怀疑漏报时打开它，把日志发我，就能精确定位。
; ------------------------------------------------------------
TraceAll=0

; ------------------------------------------------------------
; 滑动窗口长度（帧）与窗口内命中次数门槛
;
;   为什么要第二层：联机时 Execute_DoList 大约只有一半的帧被调用，
;   单帧判据本身够硬，但"短时间反复出现"更能说明问题。
;
;   默认 WindowFrames=600（约 10 秒）、WindowHits=2：
;   10 秒内命中第 2 次，就额外输出一行 *** DETECT-REPEAT，
;   屏幕提示也会变成"可疑·重复"。
;
;   想只报一次、不要升级告警：把 WindowHits 设成一个很大的数（如 999）。
; ------------------------------------------------------------
WindowFrames=600
WindowHits=2

; ------------------------------------------------------------
; 日志哈希链（防事后篡改）
;   1 = 开启（默认）
;
;   每条 DETECT 行都带一个 chain= 值，它是
;       chain = SHA256(上一条 chain || 本条记录 || 命中事件的头部字节)
;   局末再写一次最终值。想改中间任意一行，之后所有 chain 值都得重算，
;   对不上就暴露。
;
;   ⚠️ 局限（请务必知道）：
;     · 只能防【事后修改】，防不住【整份重新生成】（算法公开、无密钥）
;     · 单人日志【无法自证】，要成为有效证据需要多方交叉核对
;     · 因此只对事件头部（+0..+12）做哈希 —— 目的地之后
;       在不同机器上不一样（那是本地状态），整条哈希无法交叉验证
; ------------------------------------------------------------
HashChain=1

; ------------------------------------------------------------
; 定期报活 / 汇总间隔（帧，默认 1800 ≈ 30 秒）
;
;   每这么多帧固定输出一行：
;     [DETECT] alive f=12600 hits=5 scans=177 frames=12601 ... chain=... recs=5
;
;   ★ **这一行是关掉探针之后唯一的"活性指标"**：
;       `scans=` = 出现过 MegaMission 的帧数。
;       它在涨，就说明引擎的事件队列确实有数据、检测器在正常工作；
;       一直是 0，说明这一局根本没取到数据（例如单机，或地址不对）。
;
;   ⚠️ 1.3 起改成"无条件输出"（以前只在有新命中时才写）。
;   一局 30 分钟约 60 行，不算噪音。
;
;   0 = 不做定期输出，只在退出游戏时写一条 [DETECT-SUMMARY]。
;       （不建议设 0：那样没命中的对局从头到尾只有启动头，看不出死活）
; ------------------------------------------------------------
SummaryEvery=1800

; ------------------------------------------------------------
; 要忽略的房号（逗号分隔，例如 3,5）—— 留空 = 不忽略任何人
;
;   联机遭遇战里的电脑玩家(AI)也有自己的房号，AI 可能成批下发命令。
;   如果发现某个房号总是误报、且确认那是 AI，就在这里排除它。
;
;   ⚠️ 排除了就真的看不到了，别把真人玩家的房号写进来。
; ------------------------------------------------------------
IgnoreHouses=
